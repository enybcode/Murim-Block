modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="murimblock.client.mixins.json"

[[mixins]]
config="murimblock.mixins.json"

[[mixins]]
config="murimblock.world.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Murimblock"
logoFile="murimblock_logo.png"
logoBlur=false
description='''
The technical foundation for the Murimblock mod.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="epicfight"
type="required"
versionRange="[${epic_fight_version}]"
ordering="AFTER"
side="BOTH"

# Epic Fight: Dawn Day, for its animations only; its items, keys and skills are retired (EpicFightContentPolicy).
[[dependencies.${mod_id}]]
modId="epicfight_dd"
type="required"
versionRange="[${dawn_day_version}]"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="photon"
type="required"
versionRange="[${photon_version},)"
ordering="AFTER"
side="BOTH"

# Murim biomes in the overworld.
[[dependencies.${mod_id}]]
modId="terrablender"
type="required"
versionRange="[${terrablender_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
