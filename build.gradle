plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel', 'src/generated/**/.cache')
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations.gameTestImplementation.extendsFrom configurations.implementation
configurations.gameTestRuntimeOnly.extendsFrom configurations.runtimeOnly
def gameTestsEnabled = providers.gradleProperty('gameTests').isPresent()

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.gameTest)

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('build/game-test-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            disableIdeRun()
        }

        visualSmoke {
            client()
            gameDirectory = project.file('build/client-smoke-run')
            programArguments.addAll('--quickPlaySingleplayer', 'murim-smoke', '--width', '1280', '--height', '720')
            systemProperty 'murimblock.visualSmoke', 'true'
            disableIdeRun()
        }

        // Development-only: real client tour of the Murim biomes in a fresh normal world (see BiomeTour).
        biomeTour {
            client()
            gameDirectory = project.file('build/biome-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.biomeTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client tour of the six Murim sites, found with /locate in a fresh world (see SiteTour).
        siteTour {
            client()
            gameDirectory = project.file('build/site-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.siteTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client check of the PvP knock-down, carry and finish (see KnockdownTour).
        knockdownTour {
            client()
            gameDirectory = project.file('build/knockdown-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.knockdownTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client film of the Traveller's Staff Art's animations (see StaffTour).
        staffTour {
            client()
            gameDirectory = project.file('build/staff-tour-run')
            programArguments.addAll('--width', '960', '--height', '720')
            systemProperty 'murimblock.staffTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client checks of the Blood Sect (com.murimblock.bloodsect): the blood cloud step, the dao's
        // M1, the cultists' looks (BloodCloudStepTour, BloodDaoM1Tour, CultistLookTour).
        bloodCloudStepTour {
            client()
            gameDirectory = project.file('build/blood-cloud-step-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'bloodsect.cloudStepTour', 'true'
            disableIdeRun()
        }
        bloodDaoM1Tour {
            client()
            gameDirectory = project.file('build/blood-dao-m1-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'bloodsect.daoM1Tour', 'true'
            disableIdeRun()
        }
        cultistLookTour {
            client()
            gameDirectory = project.file('build/cultist-look-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'bloodsect.cultistLookTour', 'true'
            disableIdeRun()
        }
        // The Blood Soldiers and the Blood Lacquer, on them and on the player (SoldierLookTour).
        soldierLookTour {
