            disableIdeRun()
        }

        // Development-only: real client check of the Traveller's Staff Art in play (see TravellerStaffTour).
        travellerStaffTour {
            client()
            gameDirectory = project.file('build/traveller-staff-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.travellerStaffTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client look at the Crab King's lair, the Root Well (see CrabLairTour).
        crabLairTour {
            client()
            gameDirectory = project.file('build/crab-lair-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.crabLairTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client check of the whole fight against the Peak Captain on his leitai (see PeakCaptainFightTour).
