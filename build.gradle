        scarletBloomTour {
            client()
            gameDirectory = project.file('build/scarlet-bloom-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.scarletBloomTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client check of Murim's guard, perfect and normal parry (see ParryTour).
        parryTour {
            client()
            gameDirectory = project.file('build/parry-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.parryTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client check of the Azure Cloud Sword Art (see MartialTour).
        martialTour {
            client()
            gameDirectory = project.file('build/martial-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.martialTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client check of the Long Fist (see LongFistTour).
        // Development-only: real client tour of cultivation, filmed for its sheet (see CultivationTour).
        cultivationTour {
            client()
            gameDirectory = project.file('build/cultivation-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.cultivationTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client check of the Sanguine Art (see SanguineTour).
        sanguineTour {
            client()
            gameDirectory = project.file('build/sanguine-tour-run')
            systemProperty 'murimblock.sanguineTour', 'true'
            disableIdeRun()
        }

        longFistTour {
            client()
            gameDirectory = project.file('build/long-fist-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.longFistTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client check of the Celestial Peak Spear (see SpearTour).
        spearTour {
            client()
            gameDirectory = project.file('build/spear-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.spearTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client check of the Murim knives (see KnifeTour).
        knifeTour {
            client()
            gameDirectory = project.file('build/knife-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.knifeTour', 'true'
            disableIdeRun()
        }

        // Development-only: film of the weapons' swing trails (see TrailTour).
        trailTour {
            client()
            gameDirectory = project.file('build/trail-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.trailTour', 'true'
            disableIdeRun()
        }

        // Development-only: filming of a duel with Sensei Yun (see SenseiDuel; clip by scripts/showcase/make-clip.cjs).
        senseiDuel {
            client()
            gameDirectory = project.file('build/sensei-duel-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.senseiDuel', 'true'
            disableIdeRun()
        }

        sanguineTour {
            client()
            gameDirectory = project.file('build/sanguine-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.sanguineTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client check of Sensei Yun's model, idle, walk and cuts (see SenseiTour).
        senseiTour {
            client()
            gameDirectory = project.file('build/sensei-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.senseiTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client check of the weapons in hand, the Bandit Dao and the great axe (see WeaponTour).
        weaponTour {
            client()
            gameDirectory = project.file('build/weapon-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.weaponTour', 'true'
            disableIdeRun()
        }

        // Development-only: a film of the tiger standing, walking, attacking and dying in a real client (see TigerTour).
        tigerTour {
            client()
            gameDirectory = project.file('build/tiger-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.tigerTour', 'true'
            disableIdeRun()
        }

        // Development-only: a film of the Bandit Warlord's entrance (the cinematic, the meteor, the crater) and his moves in a real client (see WarlordTour).
        warlordTour {
            client()
            gameDirectory = project.file('build/warlord-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.warlordTour', 'true'
            disableIdeRun()
        }

        // Development-only: the same, then a killing blow: his transformation into the Son of the Demon and the arena in the sky (see WarlordTour).
        transformTour {
            client()
            gameDirectory = project.file('build/transform-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.warlordTour', 'true'
            systemProperty 'murimblock.transformTour', 'true'
            disableIdeRun()
        }

        // Development-only: the transformation recorded as a video (smooth frames at a slowed tick rate, and its sounds
        // logged for the soundtrack): build/transform-video-run/video, then scripts/animation/make-video.cjs (see WarlordTour).
        transformVideo {
            client()
            gameDirectory = project.file('build/transform-video-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.warlordTour', 'true'
            systemProperty 'murimblock.transformTour', 'true'
            systemProperty 'murimblock.videoTour', 'true'
            disableIdeRun()
        }

        // Development-only: a film of the Mountain-Shattering Fist's techniques in a real client (see MountainFistTour).
        mountainFistTour {
            client()
            gameDirectory = project.file('build/mountain-fist-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.mountainFistTour', 'true'
            disableIdeRun()
        }

        // Development-only: a mugshot of every Murim mob for the wiki (see MugshotTour).
        mugshotTour {
            client()
            gameDirectory = project.file('build/mugshot-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.mugshotTour', 'true'
            disableIdeRun()
        }

        // Development-only: the two-client check on a dedicated server (MpTourServer, MpTourClient; scripts/mp/run-mp-tour.sh).
        mpServer {
            server()
            gameDirectory = project.file('build/mp-run/server')
            programArgument '--nogui'
            systemProperty 'murimblock.mp', 'server'
            disableIdeRun()
        }
        mpClientA {
            client()
            gameDirectory = project.file('build/mp-run/a')
            programArguments.addAll('--username', 'MurimA', '--quickPlayMultiplayer', '127.0.0.1:25599', '--width', '854', '--height', '480')
            systemProperty 'murimblock.mp', 'A'
            disableIdeRun()
        }
        mpClientB {
            client()
            gameDirectory = project.file('build/mp-run/b')
            programArguments.addAll('--username', 'MurimB', '--quickPlayMultiplayer', '127.0.0.1:25599', '--width', '854', '--height', '480')
            systemProperty 'murimblock.mp', 'B'
            disableIdeRun()
        }

        // Development-only: films the vertical presentation video (see Showcase, scripts/showcase/make-video.cjs).
        showcase {
            client()
            gameDirectory = project.file('build/showcase-run')
            programArguments.addAll('--width', '594', '--height', '1056')
            systemProperty 'murimblock.showcase', 'true'
            systemProperty 'murimblock.showcaseOnly', providers.gradleProperty('showcaseOnly').getOrElse('')
            disableIdeRun()
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            )
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (gameTestsEnabled) {
                sourceSet(sourceSets.gameTest)
            }
        }
    }

    unitTest {
        enable()
        testedMod = mods.murimblock
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup('maven.modrinth') }
    }
    mavenCentral()
}

dependencies {
    implementation("maven.modrinth:epic-fight:${epic_fight_artifact}") { transitive = false }
    implementation("maven.modrinth:epic-fight-dawn-day:${dawn_day_artifact}") { transitive = false }
    implementation("maven.modrinth:geckolib:${geckolib_artifact}") { transitive = false }
    implementation("maven.modrinth:photon-editor:${photon_artifact}") { transitive = false }
    implementation("maven.modrinth:kilagraph:${kilagraph_artifact}") { transitive = false }
    implementation("maven.modrinth:ldlib:${ldlib_artifact}") { transitive = false }
    implementation("maven.modrinth:terrablender:${terrablender_artifact}") { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            epic_fight_version     : epic_fight_version,
            dawn_day_version       : dawn_day_version,
            geckolib_version       : geckolib_version,
            photon_version         : photon_version,
            terrablender_version   : terrablender_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]

    inputs.properties(replaceProperties)
    expand(replaceProperties)
    from('src/main/templates')
    into(layout.buildDirectory.dir('generated/sources/modMetadata'))
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile }).withPropertyName('distributionJar')
    systemProperty 'murimblock.test.distribution', tasks.named('jar', Jar).flatMap { it.archiveFile }.get().asFile.absolutePath
}

tasks.named('runGameTestServer').configure {
    doFirst {
        if (!gameTestsEnabled) {
            throw new GradleException('Use -PgameTests to load the foundation server tests.')
        }
    }
}

def visualSmokeWorld = layout.buildDirectory.file('client-smoke-run/saves/murim-smoke/level.dat')
def visualSmokeReport = layout.buildDirectory.file('client-smoke-run/visual-smoke-passed.txt')
tasks.named('runVisualSmoke').configure {
    doFirst {
        if (!gameTestsEnabled) throw new GradleException('Use -PgameTests for the development-only visual smoke test.')
        if (!visualSmokeWorld.get().asFile.isFile()) {
            throw new GradleException('Copy the disposable GameTest world to build/client-smoke-run/saves/murim-smoke first.')
        }
        visualSmokeReport.get().asFile.delete()
    }
    doLast {
        if (!visualSmokeReport.get().asFile.isFile()) throw new GradleException('Client visual checks did not complete; inspect the smoke log.')
    }
}

def biomeTourSave = layout.buildDirectory.dir('biome-tour-run/saves/murim-biome-tour')
def biomeTourReport = layout.buildDirectory.file('biome-tour-run/biome-tour-report.txt')
def biomeTourShots = layout.buildDirectory.dir('biome-tour-run/screenshots')
tasks.named('runBiomeTour').configure {
    doFirst {
        if (!gameTestsEnabled) throw new GradleException('Use -PgameTests for the development-only biome tour.')
        // A fresh world each time, so the biomes are generated by the current code.
        biomeTourSave.get().asFile.deleteDir()
        biomeTourShots.get().asFile.deleteDir()
        biomeTourReport.get().asFile.delete()
    }
    doLast {
        def report = biomeTourReport.get().asFile
        if (!report.isFile() || !report.text.contains('PASSED')) throw new GradleException('Biome tour failed; see build/biome-tour-run/biome-tour-report.txt')
    }
}

