            client()
            gameDirectory = project.file('build/peak-captain-fight-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'murimblock.peakCaptainFightTour', 'true'
            disableIdeRun()
        }

        // Development-only: real client look at the Captain of the Peak Guard and his swinging cloth (see PeakCaptainTour).
        peakCaptainTour {
