plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel', 'src/generated/**/.cache')
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations.gameTestImplementation.extendsFrom configurations.implementation
configurations.gameTestRuntimeOnly.extendsFrom configurations.runtimeOnly
def gameTestsEnabled = providers.gradleProperty('gameTests').isPresent()

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.gameTest)

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('build/game-test-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            disableIdeRun()
        }

        visualSmoke {
            client()
            gameDirectory = project.file('build/client-smoke-run')
            programArguments.addAll('--quickPlaySingleplayer', 'murim-smoke', '--width', '1280', '--height', '720')
            systemProperty 'murimblock.visualSmoke', 'true'
            disableIdeRun()
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
            )
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (gameTestsEnabled) {
                sourceSet(sourceSets.gameTest)
            }
        }
    }

    unitTest {
        enable()
        testedMod = mods.murimblock
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup('maven.modrinth') }
    }
    mavenCentral()
}

dependencies {
    implementation("maven.modrinth:epic-fight:${epic_fight_artifact}") { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            epic_fight_version     : epic_fight_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]

    inputs.properties(replaceProperties)
    expand(replaceProperties)
    from('src/main/templates')
    into(layout.buildDirectory.dir('generated/sources/modMetadata'))
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('runGameTestServer').configure {
    doFirst {
        if (!gameTestsEnabled) {
            throw new GradleException('Use -PgameTests to load the foundation server tests.')
        }
    }
}

def visualSmokeWorld = layout.buildDirectory.file('client-smoke-run/saves/murim-smoke/level.dat')
def visualSmokeReport = layout.buildDirectory.file('client-smoke-run/visual-smoke-passed.txt')
tasks.named('runVisualSmoke').configure {
    doFirst {
        if (!gameTestsEnabled) throw new GradleException('Use -PgameTests for the development-only visual smoke test.')
        if (!visualSmokeWorld.get().asFile.isFile()) {
            throw new GradleException('Copy the disposable GameTest world to build/client-smoke-run/saves/murim-smoke first.')
        }
        visualSmokeReport.get().asFile.delete()
    }
    doLast {
        if (!visualSmokeReport.get().asFile.isFile()) throw new GradleException('Client visual checks did not complete; inspect the smoke log.')
    }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
