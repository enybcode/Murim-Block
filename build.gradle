plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup('maven.modrinth') }
    }
    mavenCentral()
}

dependencies {
    implementation("maven.modrinth:geckolib:${geckolib_artifact}") { transitive = false }
    implementation("maven.modrinth:player-animation-library:${pal_artifact}") { transitive = false }
    implementation("maven.modrinth:photon-editor:${photon_artifact}") { transitive = false }
    implementation("maven.modrinth:ldlib:${ldlib_artifact}") { transitive = false }
    implementation("maven.modrinth:kilagraph:${kilagraph_artifact}") { transitive = false }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            geckolib_version       : geckolib_version,
            pal_version            : pal_version,
            photon_version         : photon_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand(replaceProperties)
    from('src/main/templates')
    into(layout.buildDirectory.dir('generated/sources/modMetadata'))
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
