plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Dev only: screenshots every System page into run/screenshots, then quits.
        // Window size: -PshotWidth=1280 -PshotHeight=720 (default 1920 x 1080).
        guiShots {
            client()
            systemProperty 'murimblock.guiShots', 'true'
            programArguments.addAll('--width', (project.findProperty('shotWidth') ?: '1920').toString(),
                    '--height', (project.findProperty('shotHeight') ?: '1080').toString())
        }

        // Dev only: films the trial's getting-up animation from the side, one shot per tick, then quits.
        riseFilm {
            client()
            systemProperty 'murimblock.riseFilm', 'true'
            gameDirectory = project.file('run/rise-film')
            programArguments.addAll('--width', '960', '--height', '640')
        }

        // Dev only: checks the inner world in a real client (PASS/FAIL in the log), shots in run/screenshots, quits.
        innerWorldTour {
            client()
            systemProperty 'murimblock.innerWorldTour', 'true'
            // Its own folder, so it can run while a normal client is open on run/.
            gameDirectory = project.file('run/inner-world-tour')
            programArguments.addAll('--width', '1920', '--height', '1080')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup('maven.modrinth') }
    }
    mavenCentral()
}

dependencies {
    implementation("maven.modrinth:geckolib:${geckolib_artifact}") { transitive = false }
    implementation("maven.modrinth:player-animation-library:${pal_artifact}") { transitive = false }
    implementation("maven.modrinth:photon-editor:${photon_artifact}") { transitive = false }
    implementation("maven.modrinth:ldlib:${ldlib_artifact}") { transitive = false }
    implementation("maven.modrinth:kilagraph:${kilagraph_artifact}") { transitive = false }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    // Minecraft's maths library, for the pure animation code (same version as Minecraft 1.21.1).
    testImplementation 'org.joml:joml:1.10.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            geckolib_version       : geckolib_version,
            pal_version            : pal_version,
            photon_version         : photon_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand(replaceProperties)
    from('src/main/templates')
    into(layout.buildDirectory.dir('generated/sources/modMetadata'))
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
