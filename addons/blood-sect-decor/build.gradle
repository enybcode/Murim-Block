plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}
version = '1.10.1'
group = 'com.colleuhu95'
base { archivesName = 'blood-sect-decor' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
sourceSets { gameTest { compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output } }
configurations.gameTestImplementation.extendsFrom configurations.implementation
configurations.gameTestRuntimeOnly.extendsFrom configurations.runtimeOnly
neoForge {
    version = '21.1.248'
    addModdingDependenciesTo(sourceSets.gameTest)
    runs {
        client { client() }
        cloudStepTour {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('build/cloud-step-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'bloodsect.cloudStepTour', 'true'
            disableIdeRun()
        }
        daoM1Tour {
            client()
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('build/dao-m1-tour-run')
            programArguments.addAll('--width', '1280', '--height', '720')
            systemProperty 'bloodsect.daoM1Tour', 'true'
            disableIdeRun()
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = project.file('build/game-test-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'bloodsect'
            disableIdeRun()
        }
    }
    mods {
        bloodsect {
            sourceSet(sourceSets.main)
            if (providers.gradleProperty('gameTests').isPresent()) { sourceSet(sourceSets.gameTest) }
        }
    }
}
