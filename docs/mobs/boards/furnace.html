<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Fourneau d'alchimie — animations</title>
<link rel="stylesheet" href="style.css"><script src="board.js"></script></head><body><script>
// The furnace in profile, facing right. A pose: lean (tilt, degrees, forward +), hx/hy (moved, px, hy down +),
// swell (the vessel bulging, 0 to 1), lid (how far the lid lifts, px), lidTilt (degrees), glow (0 to 1, the fire
// whitening), steam: jets [[x, y, dx, dy]] from the vessel's centre, puff (a puff from the chimney, 0 to 1), legs:
// [front, back] foot offsets [dx, dy]. Points: lid, body, vent, tip (the lid's top).
const G = 34;
function furnacePoints(x, y, p) {
  const a = rad(p.lean || 0), ca = Math.cos(a), sa = Math.sin(a);
  const base = [x + 6 + (p.hx || 0), y + G - 22 + (p.hy || 0)];
  const at = (u, v) => [base[0] + u * ca - v * sa, base[1] + u * sa + v * ca];
  const s = 1 + (p.swell || 0) * 0.35;
  return {at, s, base, body: at(0, -28 * s), lid: at(0, -54 * s - (p.lid || 0)), tip: at(0, -66 * s - (p.lid || 0)),
    vent: at(8, -60 * s - (p.lid || 0))};
}
window.BODY = (x, y, p) => furnacePoints(x, y, p);
window.FIGURE = (x, y, p, ghost) => {
  const r = furnacePoints(x, y, p);
  const col = c => ghost ? C.ghost : c;
  const box = (pts, fill) => `<path d="M${pts.map(q => q.join(',')).join(' L')} Z" fill="${col(fill)}"/>`;
  const A = r.at, s = r.s, w = 26 * (1 + (p.swell || 0) * 0.45);
  let out = `<g${ghost ? ' opacity="0.28"' : ''}>`;
  // Legs: one in front, one behind (the third hides behind the front one).
  const [lf, lb] = p.legs || [[0, 0], [0, 0]];
  const feet = [[x + 22 + lf[0], y + G - lf[1]], [x - 8 + lb[0], y + G - lb[1]]];
  [[A(-12, 0), feet[1], '#3e2c10'], [A(12, 0), feet[0], '#5e4316']].forEach(([h, f, c]) => {
    const k = [(h[0] + f[0]) / 2 + 3, (h[1] + f[1]) / 2];
    out += line(h, k, col(c), 7) + line(k, f, col(c), 6) + line(f, [f[0] + 7, f[1]], col('#b0862e'), 4);
  });
  // Vessel: belly, neck, rim, ribs, the mouth with its fire, the seal plaque.
  out += box([A(-w, -2), A(w, -2), A(w + 2, -16 * s), A(-w - 2, -16 * s)], '#8f6a22');
  out += box([A(-w + 2, -16 * s), A(w - 2, -16 * s), A(w - 3, -44 * s), A(-w + 3, -44 * s)], '#a07626');
  out += box([A(-w - 1, -44 * s), A(w + 1, -44 * s), A(w + 1, -49 * s), A(-w - 1, -49 * s)], '#d2a849');
  out += box([A(w - 4, -2), A(w - 1, -2), A(w - 1, -46 * s), A(w - 4, -46 * s)], '#d2a849');
  const glow = p.glow || 0;
  const fire = glow > 0.75 ? '#ffffff' : glow > 0.4 ? '#ffe08a' : '#e8742a';
  out += box([A(w - 2, -24 * s), A(w + 2, -24 * s), A(w + 2, -36 * s), A(w - 2, -36 * s)], '#2a1a0c');
  out += box([A(w, -26 * s), A(w + 2.5, -26 * s), A(w + 2.5, -34 * s), A(w, -34 * s)], fire);
  // Handle ring.
  out += `<rect x="${A(-w - 7, -40 * s)[0]}" y="${A(-w - 7, -40 * s)[1]}" width="6" height="${10 * s}" fill="none"
    stroke="${col('#5e4316')}" stroke-width="3"/>`;
  // The gap under a lifted lid: the fire glows through it.
  if ((p.lid || 0) > 2 && glow >= 0.3 && !ghost) {
    const g1 = A(-w + 2, -49 * s), g2 = A(w - 2, -49 * s);
    out += line(g1, g2, fire, Math.min(p.lid, 14));
  }
  // Lid (lifted and tilted), its knob, the chimney.
  const L = (u, v) => {
    const t = rad((p.lean || 0) + (p.lidTilt || 0)), c2 = Math.cos(t), s2 = Math.sin(t);
    const o = A(0, -49 * s - (p.lid || 0));
    return [o[0] + u * c2 - v * s2, o[1] + u * s2 + v * c2];
  };
  out += box([L(-w + 1, 0), L(w - 1, 0), L(w - 6, -7), L(-w + 6, -7)], '#5e4316');
  out += box([L(-9, -7), L(9, -7), L(6, -11), L(-6, -11)], '#7a5a1e');
  out += box([L(-3, -11), L(3, -11), L(3, -17), L(-3, -17)], '#d2a849');
  out += box([L(9, -7), L(13, -7), L(13, -13), L(9, -13)], '#2e2008');
  // Steam: jets out of the seams, a puff from the chimney.
  if (!ghost) {
    for (const [u, v, du, dv] of p.steam || []) {
      const from = A(u, v * s);
      out += `<path d="M${from[0]},${from[1]} q${du / 2},${dv / 2 - 4} ${du},${dv}" stroke="#e8eef2"
        stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>`;
    }
    if (p.puff) {
      const v = L(11, -14);
      out += `<circle cx="${v[0] + 4}" cy="${v[1] - 10 * p.puff}" r="${4 + 6 * p.puff}" fill="#e8eef2" opacity="0.8"/>`;
    }
    if (p.whistle) {
      const v = L(11, -16);
      out += `<text x="${v[0] + 8}" y="${v[1] - 14}" font-size="${9 + 4 * p.whistle}" fill="#3a6fb0"
        font-weight="700">${'♪'.repeat(Math.ceil(p.whistle * 3))}</text>`;
    }
  }
  return out + '</g>';
};

const REST = {lean: 0, puff: 0.3};
const REST_2 = {lean: 0, hy: 1, swell: 0.03, puff: 0.8, lid: 1};
const STEP_1 = {lean: 8, hx: 4, legs: [[8, 6], [-4, 0]]};
const STEP_2 = {lean: -8, hx: 8, legs: [[4, 0], [6, 6]]};
const RATTLE = {lean: -2, swell: 0.12, glow: 0.3, lid: 4, lidTilt: 8, puff: 1, whistle: 0.3};
const RATTLE_2 = {lean: 2, swell: 0.14, glow: 0.4, lid: 7, lidTilt: -6, puff: 1, whistle: 0.4};
const PRESSURE = {lean: -3, swell: 0.4, glow: 0.6, lid: 12, lidTilt: 14, whistle: 0.7,
  steam: [[26, -44, 14, -10], [-26, -44, -14, -10], [24, -16, 16, 4]]};
const SCREAM = {lean: 0, hy: -2, swell: 0.75, glow: 0.9, lid: 20, lidTilt: -18, whistle: 1,
  steam: [[28, -46, 20, -16], [-28, -46, -20, -16], [27, -16, 22, 2], [-27, -16, -22, 2], [0, -48, 0, -20]]};
const POP = {lean: 0, swell: 1, glow: 1, lid: 40, lidTilt: 40, whistle: 1,
  steam: [[0, -48, -10, -30], [28, -30, 26, -6], [-28, -30, -26, -6], [26, -6, 24, 6], [-26, -6, -24, 6]]};
const CALM = {lean: 0, swell: 0.05, glow: 0.2, lid: 0, puff: 1};
const TIP = {lean: 55, hx: 10, hy: 4, glow: 0.1, lid: 4, lidTilt: 30, legs: [[16, 18], [0, 4]],
  steam: [[0, -46, 10, -14]]};
const DOWN = {lean: 88, hx: 22, hy: 8, glow: 0, lid: 12, lidTilt: 90, legs: [[30, 28], [10, 20]]};

sheet({
  weapon: 'none',
  colors: {robe: '#a07626'},
  title: 'FOURNEAU D\'ALCHIMIE — ANIMATIONS',
  sub: 'Proposition avant animation · même modèle validé, qui se comporte comme une théière : la chaleur soulève '
    + 'le couvercle de plus en plus haut, le feu luit dans la fente, puis il saute · profil, regarde à droite',
  wrong: [
    'Aujourd\'hui il est figé dans sa pose, même quand il marche.',
    'La mèche n\'est que le gonflement et le flash blanc du creeper vanilla : rien ne rappelle une bouilloire.',
    'Pas de vapeur, pas de sifflement, le couvercle ne bouge pas.',
  ],
  fix: [
    'La mèche devient une montée en pression lisible : cliquetis, puis jets de vapeur, puis sifflement aigu.',
    'Le couvercle mène tout : la chaleur le soulève un peu plus à chaque phase, le feu luit dans la fente, '
      + 'puis il part comme un bouchon.',
    'Son de bouilloire (original, fait par nous) qui monte en aigu sur 1,5 s ; vapeur en particules.',
    'S\'il se calme (on s\'éloigne), il souffle un long « pschhh » et le couvercle retombe.',
  ],
  anims: [
    {name: 'Repos', meta: 'boucle · 40 ticks',
      feel: 'une théière qui mijote : un petit nuage de temps en temps, le couvercle qui tinte.',
      read: 'il a l\'air inoffensif, mais il est déjà chaud.',
      frames: [
        {ticks: '0', phase: 'mijote', pose: REST, note: 'Posé sur ses trois pieds, une volute sort de la cheminée.'},
        {ticks: '0 → 20', phase: 'bulle', pose: REST_2, from: REST, trace: 'lid', bend: 0,
          note: 'Le couvercle se soulève d\'un pixel et retombe avec un « tink ».'},
      ]},
    {name: 'Marche', meta: 'boucle · 16 ticks',
      feel: 'un dandinement lourd : la cuve tangue d\'un pied sur l\'autre, le couvercle claque à chaque pas.',
      read: 'on l\'entend venir : bronze qui tinte et couvercle qui claque.',
      frames: [
        {ticks: '0 → 8', phase: 'pas', pose: STEP_1, from: REST, trace: 'body', bend: 0,
          arrows: [{at: 'body', from: [-10, -30], to: [10, -30], color: '#3a6fb0'}],
          note: 'Il se penche sur le pied avant ; les deux autres suivent.'},
        {ticks: '8 → 16', phase: 'pas', pose: STEP_2, from: STEP_1, trace: 'lid', bend: 6,
          note: 'Il bascule sur l\'arrière ; le couvercle tressaute.'},
      ]},
    {name: 'Mèche — la bouilloire', meta: '30 ticks (1,5 s, comme le creeper) · explosion au tick 30 · à 3 blocs',
      feel: 'la pression qui monte : tink… tink-tink-tink… pschhh… puis le sifflement strident d\'une bouilloire.',
      read: 'le couvercle qui claque = recule ; la vapeur qui jaillit = trop tard pour frapper, cours.',
      frames: [
        {ticks: '1 → 10', phase: 'cliquetis', phaseColor: '#a32020', pose: RATTLE, from: REST, trace: 'lid',
          bend: 0, note: 'Il se fige. Le couvercle claque de plus en plus vite, le feu passe à l\'orange vif, un '
            + 'premier sifflement grave.'},
        {ticks: '10 → 18', phase: 'il tremble', phaseColor: '#a32020', pose: RATTLE_2, from: RATTLE, trace: 'lid',
          bend: 0, note: 'Toute la cuve vibre sur ses pieds, la cheminée crache des bouffées.'},
        {ticks: '18 → 24', phase: 'vapeur', phaseColor: '#a32020', pose: PRESSURE, from: RATTLE_2, trace: 'lid',
          bend: 0, note: 'La cuve gonfle, des jets de vapeur fusent par la lèvre et le foyer ; le sifflement monte.'},
        {ticks: '24 → 29', phase: 'il hurle', phaseColor: '#c46a00', pose: SCREAM, from: PRESSURE, trace: 'lid',
          bend: 0, note: 'Sifflement strident, vapeur partout, feu blanc, il se soulève sur la pointe des pieds.'},
        {ticks: '30', phase: 'EXPLOSION', phaseColor: '#c46a00', pose: POP, from: SCREAM, trace: 'tip', bend: 0,
          impact: true, note: 'Le couvercle part comme un bouchon (il retombe plus loin), nuage de vapeur, feu et '
            + 'éclats de bronze.'},
      ]},
    {name: 'Il se calme', meta: '20 ticks · quand la cible s\'éloigne à plus de 7 blocs',
      feel: 'le soulagement : un long « pschhh », la vapeur retombe, le couvercle se pose.',
      read: 'il refroidit : il faudra le relancer depuis le début.',
      frames: [
        {ticks: '0 → 20', phase: 'pschhh', phaseColor: '#2f6b4f', pose: CALM, from: PRESSURE, trace: 'lid', bend: 0,
          note: 'La cuve dégonfle, le couvercle retombe, une dernière bouffée par la cheminée.'},
      ]},
    {name: 'Mort', meta: '20 ticks · tué avant d\'exploser',
      feel: 'une théière renversée : elle bascule, le couvercle roule, la vapeur fuit en sifflotant.',
      read: 'tué à temps : plus de danger.',
      frames: [
        {ticks: '0 → 8', phase: 'bascule', pose: TIP, from: REST, trace: 'tip', bend: -10,
          note: 'Il tombe sur le flanc, un jet de vapeur s\'échappe.'},
        {ticks: '8 → 20', phase: 'au sol', pose: DOWN, from: TIP, trace: 'tip', bend: 0,
          note: 'Couché, le couvercle a roulé, le feu s\'éteint dans un dernier filet de fumée.'},
      ]},
  ],
});
</script></body></html>
