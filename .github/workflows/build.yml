name: Build

on:
  push:
    branches: [test, main, master]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cloud setup script checks
        run: |
          bash -n scripts/cloud/gradle.sh scripts/cloud/setup.sh scripts/cloud/verify.sh
          node --test scripts/cloud/configure-gradle.test.cjs

      - name: Build and compile development harness
        run: ./gradlew build compileGameTestJava

      - name: Foundation server tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -PgameTests runGameTestServer 2>&1 | tee gametest-output.log
          grep -Eq 'All [1-9][0-9]* required tests passed' gametest-output.log
