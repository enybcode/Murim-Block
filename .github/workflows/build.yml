name: Build

on:
  push:
    branches: [test, main, master]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Foundation server tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew -PgameTests runGameTestServer 2>&1 | tee gametest-output.log
          grep -Eq 'All [1-9][0-9]* required tests passed' gametest-output.log
